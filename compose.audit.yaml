# Isolated final-audit infrastructure. The -p jungle-audit project owns its volume.
# Docker Compose v2.24.4+ is required for !override.
services:
  api:
    ports: !override
      - "18080:8080"
    environment:
      OIDC_ISSUER_URL: http://localhost:18081/realms/jungle
  postgres:
    ports: !override
      - "15432:5432"
  localstack:
    ports: !override
      - "14566:4566"
  keycloak:
    ports: !override
      - "18081:8080"
    environment:
      KC_HOSTNAME: http://localhost:18081
